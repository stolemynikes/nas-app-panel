# NAS Beheer on the Synology NAS. Container Manager -> Project -> Create -> choose this folder.
# Step by step: docs/installatie-nl.md
#
# Only for the office network: port 8081 is opened on the NAS, NEVER forward it in the router,
# and no tunnel goes to this container.

services:
  nas-beheer:
    # The image GitHub builds after a push to the branch release (Paneel -> Updates). build: . only when building here yourself.
    image: ghcr.io/stolemynikes/nas-beheer:release
    build: .
    container_name: nas-beheer
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: 8081
      DATA_DIR: /app/data
      TZ: Europe/Amsterdam
      NGROK_AGENT_URL: http://nas-beheer-ngrok:4040
    ports:
      - "8081:8081"
    volumes:
      - beheer-data:/app/data
    networks:
      # Shared with the apps (create it once: Container Manager -> Network -> Add -> nas-apps)
      - nas-apps

  # The fixed internet addresses (tab Algemeen). Only starts with COMPOSE_PROFILES=ngrok in .env.
  # The panel tells this container which address goes to which app; its control port (4040)
  # is only reachable inside the network nas-apps, never from the office or the internet.
  ngrok:
    image: ngrok/ngrok:3
    container_name: nas-beheer-ngrok
    restart: unless-stopped
    profiles: ["ngrok"]
    command: start --none --config /etc/ngrok/ngrok.yml
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    volumes:
      - ./ngrok.yml:/etc/ngrok/ngrok.yml:ro
    networks:
      - nas-apps

  # The updater (updater/server.mjs): downloads and starts new versions of the apps, only when a beheerder
  # clicks "Bijwerken" in the panel. It is the only container that may use Docker on the NAS (the socket below
  # gives full control over Docker), so it does nothing on its own, has no ports, needs UPDATER_KEY,
  # and only knows the apps in UPDATE_APPS.
  updater:
    image: ghcr.io/stolemynikes/nas-beheer-updater:release
    build:
      context: .
      dockerfile: updater/Dockerfile
    container_name: nas-beheer-updater
    restart: unless-stopped
    environment:
      UPDATER_KEY: ${UPDATER_KEY}
      GHCR_USER: ${GHCR_USER}
      GHCR_TOKEN: ${GHCR_TOKEN}
      UPDATE_APPS: facturen=factuur-app/factuur-app,kasper=casper/casper,paneel=nas-beheer/nas-beheer
      PROJECTS_DIR: /volume1/docker
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # The same path as on the NAS: Docker reads the project folders (docker-compose.yml, .env) from here
      - /volume1/docker:/volume1/docker
      - updater-login:/root/.docker
    networks:
      - nas-apps

networks:
  nas-apps:
    external: true
    name: nas-apps

volumes:
  beheer-data:
  updater-login:
